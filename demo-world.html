<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Metropolis — World Renderer Demo</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font: 12px/1.35 system-ui, sans-serif; color: #e8edf2; }
  #c { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #hud { position: absolute; left: 8px; top: 8px; padding: 6px 9px; background: rgba(10, 14, 20, .55); border-radius: 6px; pointer-events: none; white-space: pre; }
  #hud.hidden { display: none; }
  #legend { position: absolute; right: 8px; top: 8px; padding: 6px 9px; background: rgba(10, 14, 20, .6); border-radius: 6px; pointer-events: none; }
  #legend:empty { display: none; }
  #legend .sw { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="legend"></div>
<script type="module" src="/src/render/world/demo.ts"></script>
</body>
</html>
