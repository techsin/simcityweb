<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Asset Gallery</title>
<style>
  html, body { margin: 0; background: #1b1f24; color: #eee; font: 12px/1.3 system-ui, sans-serif; }
  #wrap { position: relative; display: inline-block; }
  #labels { position: absolute; inset: 0; pointer-events: none; }
  .lbl { position: absolute; padding: 3px 6px; background: rgba(0,0,0,.55); border-radius: 3px; font-weight: 600; }
  .lbl.bad { background: rgba(170,20,20,.8); }
  .lbl small { font-weight: 400; opacity: .8; }
  #info { padding: 6px 8px; }
  #projects { padding: 6px 8px; }
  #projects a { color: #b9d8ef; margin-right: 12px; }
</style>
</head>
<body>
<nav id="projects" aria-label="Mega-project model review">
  Mega-projects:
  <a href="?model=tr_express_metro,util_fusion_plant,lm_world_expo,lm_expo_tower,rw_space_center&amp;cols=3">Day</a>
  <a href="?model=tr_express_metro,util_fusion_plant,lm_world_expo,lm_expo_tower,rw_space_center&amp;cols=3&amp;night=1">Night</a>
  <a href="?model=tr_express_metro,util_fusion_plant,lm_world_expo,lm_expo_tower,rw_space_center&amp;cols=3&amp;month=0&amp;climate=temperate">Winter foliage</a>
</nav>
<div id="wrap"><canvas id="c"></canvas><div id="labels"></div></div>
<div id="info"></div>
<script type="module">
  import { setFoliageSeason } from '/src/assets/materials.ts';
  import { setTreeSeason } from '/src/assets/builders/nat_season.ts';
  const params = new URLSearchParams(location.search);
  const month = Number(params.get('month'));
  if (params.has('month') && Number.isFinite(month)) {
    const climate = params.get('climate') ?? 'temperate';
    setFoliageSeason(month, climate);
    setTreeSeason(month, climate);
  }
  await import('/src/gallery/main.ts');
</script>
</body>
</html>
