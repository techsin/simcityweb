[package]
name = "sim-kernels"
version = "0.1.0"
edition = "2024"
publish = false
# pre-sizes the wasm linear memory (see the file); under src/ so the build-wasm source hash covers it
build = "src/build.rs"
description = "Metropolis simulation kernels compiled to wasm32 (raw exports, no wasm-bindgen, no external crates)"

[lib]
# cdylib -> sim_kernels.wasm; rlib so `cargo test` can run the pure-Rust unit tests on the host
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
default = []
# Size experiment only: link std instead of #![no_std] (see wasm/README.md "no_std"). Never shipped.
std = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
# strip the name section (function names) from the shipped binary; tools/build-wasm.mjs --names keeps them
strip = true
incremental = false
